<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
</head>
<body>
<h2>Registrar Usuario</h2>

<form th:action="@{/registro}" th:object="${usuario}" method="post">
    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}"/> <br/><br>

    <label>Correo:</label>
    <input type="email" th:field="*{correo}"/> <br/><br>

    <label>Contraseña:</label>
    <input type="password" th:field="*{password}"/> <br/><br>

    <button type="submit">Registrar</button>
</form>

</body>
</html>
